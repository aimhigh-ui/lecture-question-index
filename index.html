<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="トレアカ講義の質問ポイントを講義ごとに一覧できます。問いかけと講義再開の場面へ、YouTubeの該当時刻から移れます。">
<title>トレアカ講義 質問ポイント一覧</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="chip">トレアカ講義</p>
    <h1>講義の質問ポイント</h1>
    <p class="lead">問いかけと講義再開の場所を、講義ごとに探せます</p>
  </div>
</header>

<main class="wrap">
  <div class="picker">
    <label for="lecture-select">講義を選ぶ</label>
    <select id="lecture-select" aria-controls="panel"></select>
  </div>
  <div class="tabs" role="tablist" aria-label="講義" id="tabs"></div>

  <section class="panel" id="panel" role="tabpanel" aria-live="polite">
    <p class="status" id="status">読み込み中です。</p>
  </section>

  <p class="foot">
    文字起こしは自動生成のため、問いかけと反応は表記を整えて要約しています。時刻は文字起こしの表示値で、動画の再生位置と数秒ずれることがあります。受講者の氏名は載せていません。
  </p>
</main>

<noscript><p class="wrap status">この一覧を見るにはJavaScriptを有効にしてください。</p></noscript>
<script src="app.js"></script>
</body>
</html>
